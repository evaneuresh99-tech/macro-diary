<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macros">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Macro Diary</title>
<style>
:root{
  --bg:#0d0f0c; --card:#161914; --card2:#1d211a; --line:#272c22;
  --text:#e9efe3; --muted:#8b9584; --accent:#9bd12b; --accent-ink:#0d0f0c;
  --warn:#f2c14e; --bad:#ff6b5b; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
input{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus{border-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.link{background:none;border:none;color:var(--accent);padding:8px 0}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
.muted{color:var(--muted)} .small{font-size:13px} .pad{padding:24px 16px}
h1,h2,h3{margin:0} h3{font-size:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.top h2{font-size:18px}
.datebar{display:flex;align-items:center;gap:6px}
.datebar button{padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.kc{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--line);border-radius:0;padding:9px 0}
.row:last-of-type{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:12px}
.row.off{opacity:.45}
.dot{width:20px;display:flex;justify-content:center;flex:none}
.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.plan-tag{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.tot{font-size:13px;color:var(--muted);padding:8px 0 2px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btns>button{flex:1}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:34px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--bad)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.macros .m{font-size:12px;color:var(--muted)}
.macros .m b{display:block;color:var(--text);font-size:14px;font-variant-numeric:tabular-nums}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--card2);font-size:14px}
.status.good{color:var(--accent)} .status.bad{color:var(--bad)}
.badge{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--warn);color:var(--warn);margin-left:6px}
.inline{display:flex;gap:8px;margin-top:8px}
.inline input:first-child{flex:2}.inline input{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12px;color:var(--muted)}
label.f input{margin-top:4px}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--card2);color:var(--warn);margin-bottom:10px}
.preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0;text-align:center}
.preview div{background:var(--card2);border-radius:10px;padding:8px 2px;font-size:11px;color:var(--muted)}
.preview b{display:block;font-size:15px;color:var(--text)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,12,.96);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:12px;padding:8px 0}
nav button.on{color:var(--accent);font-weight:600}
#sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--card);border-top-left-radius:18px;border-top-right-radius:18px;width:100%;max-width:560px;
  max-height:90vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.x{background:none;border:none;font-size:18px;padding:4px 8px;color:var(--muted)}
.list{margin-top:8px}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:220px}
.hist-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:20;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.meal-name{font-weight:600;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0}
.grams-in{width:76px;padding:6px 8px;text-align:right}
.var-l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="pad muted">Loading…</div></div>
<div id="sheet-wrap" class="hidden"><div id="sheet"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
